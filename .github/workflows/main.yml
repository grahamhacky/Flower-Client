name: Build Flower Client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Fabric mod (1.21.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build mod
        working-directory: mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flowerclient-mod
          path: |
            mod/build/libs/flowerclient-*.jar
            !mod/build/libs/*-sources.jar

  launcher:
    name: Launcher (Windows)
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: flowerclient-mod, path: launcher/resources/mods }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Write stats endpoint (from secret)
        working-directory: launcher
        shell: bash
        run: |
          printf '{"url":"%s"}' "${STATS_WEBHOOK}" > stats-endpoint.json
        env:
          STATS_WEBHOOK: ${{ secrets.STATS_WEBHOOK }}
      - name: Install
        working-directory: launcher
        run: npm install
      - name: Package installer
        working-directory: launcher
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FlowerClient-Setup
          path: launcher/dist/*.exe
